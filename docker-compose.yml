version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: eventops-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eventops-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/eventops
      JWT_SECRET: change_this_secret_in_production
      JWT_EXPIRES_IN: 24h
      JWT_REFRESH_SECRET: change_this_refresh_secret
      JWT_REFRESH_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./react-app
      dockerfile: Dockerfile
    container_name: eventops-frontend
    restart: on-failure
    ports:
      - '3000:3000'
    depends_on:
      backend:
        condition: service_healthy
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
      REACT_APP_WS_URL: http://localhost:5000
      SKIP_PREFLIGHT_CHECK: "true"
      CI: "false"
      HOST: "0.0.0.0"
      WDS_SOCKET_PORT: "0"
      GENERATE_SOURCEMAP: "false"
      TSC_COMPILE_ON_ERROR: "true"
      DISABLE_ESLINT_PLUGIN: "true"

volumes:
  mongo-data:
