services:
  - type: web
    name: eventops-platform
    env: node
    plan: free
    buildCommand: cd react-app && npm install --production=false --legacy-peer-deps && GENERATE_SOURCEMAP=false npm run build && cd ../backend && npm install --legacy-peer-deps
    startCommand: cd backend && node config/seed.js && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "24h"
      - key: JWT_REFRESH_EXPIRES_IN
        value: "7d"
      # Optional features (leave blank or fill in Render dashboard if needed)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
